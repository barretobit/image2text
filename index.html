<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Paste a screenshot and copy its text. OCR runs entirely in your browser.">
  <title>Image2Text</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔎</text></svg>">
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@7.0.0/dist/tesseract.min.js" defer></script>
  <script src="app.js" defer></script>
</head>
<body>
  <main>
    <header>
      <h1>Image2Text</h1>
      <p class="intro">Paste a screenshot and copy its text. Everything runs in your browser, so your images are never uploaded.</p>
    </header>

    <section class="drop-zone" id="drop-zone">
      <p class="hint">
        Paste a screenshot (Ctrl+V or ⌘V), drop an image anywhere on the page, or
        <label class="file-label">choose a file<input id="file-input" type="file" accept="image/*"></label>.
      </p>
      <figure class="preview" id="preview-frame" hidden>
        <img id="preview" alt="The image being read">
      </figure>
    </section>

    <div class="toolbar">
      <label for="language">Text language</label>
      <select id="language">
        <option value="eng">English</option>
        <option value="deu">German</option>
        <option value="fra">French</option>
        <option value="ita">Italian</option>
      </select>
      <p class="status" id="status" role="status" aria-live="polite"></p>
    </div>

    <label class="output-label" for="output">Extracted text</label>
    <textarea id="output" rows="12" spellcheck="false" placeholder="The text from your image appears here."></textarea>

    <button id="copy-button" type="button" disabled>Copy text</button>
  </main>
</body>
</html>
